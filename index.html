<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let latestResult = null;
let currentMarket = 'US';

// --- V9.6 穩健型全球數據讀取 (Multi-Proxy) ---
async function fetchStockData(symbol) {
    let querySymbol = symbol.toUpperCase().trim();
    let marketTag = 'US';
    
    // 智能後綴
    if (/^\d{4,5}$/.test(querySymbol)) { querySymbol += ".HK"; marketTag = 'HK'; }
    else if (querySymbol.endsWith('.HK')) marketTag = 'HK';
    else if (querySymbol.endsWith('.TW')) marketTag = 'TW';
    
    currentMarket = marketTag;
    document.getElementById('market-tag').innerText = marketTag === 'HK' ? 'HKEX' : (marketTag === 'TW' ? 'TWSE' : 'US MARKET');

    const proxies = [
        `https://api.allorigins.win/raw?url=`,
        `https://corsproxy.io/?`,
        `https://thingproxy.freeboard.io/fetch/`
    ];

    let lastError = "";
    // 嘗試多個 Proxy 直到成功
    for (let proxy of proxies) {
        try {
            const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${querySymbol}?range=2y&interval=1d`;
            const resp = await fetch(proxy + encodeURIComponent(targetUrl));
            if (!resp.ok) throw new Error("Proxy response not ok");
            const json = await resp.json();
            if (!json.chart || !json.chart.result) throw new Error("Invalid Yahoo data");
            
            const res = json.chart.result[0];
            const timestamps = res.timestamp;
            const quotes = res.indicators.quote[0];
            
            let formatted = [];
            if(timestamps) {
                for(let i=0; i<timestamps.length; i++) {
                    if(quotes.open[i]!=null && quotes.close[i]!=null) {
                        formatted.push({
                            t: timestamps[i]*1000,
                            o: quotes.open[i], h: quotes.high[i], l: quotes.low[i], c: quotes.close[i],
                            v: quotes.volume[i] || 0
                        });
                    }
                }
            }
            // Yahoo 給的是從舊到新，我們習慣反轉 (最新在 index 0)
            return formatted.reverse();
        } catch(e) {
            console.warn("Proxy failed:", proxy, e);
            lastError = e.message;
            continue;
        }
    }
    throw new Error("無法連接任何數據節點，請稍後再試。");
}

// --- V9.7 核心邏輯 (Pure Inertia: Strict Past Data) ---
function runPredictionModel(allData, tIdx) {
    // 關鍵修改：
    // tIdx 是「預測目標日」的 index。
    // 如果 tIdx = 0 (Today), 我們必須確保輸入數據從 tIdx + 1 (Yesterday) 開始。
    // 這確保了我們只使用「過去已發生」的數據，不包含今日實時數據。
    
    const baseIdx = tIdx + 1; // 數據輸入起點 (昨日)
    if (baseIdx + 60 >= allData.length) return null; // 數據不足

    // 1. 慣性萃取 (過去5天，不含目標日)
    const history5 = allData.slice(baseIdx, baseIdx + 5);
    const avgVol = history5.reduce((acc, d) => acc + (d.h - d.l), 0) / 5;
    const refClose = allData[baseIdx].c; // 昨日收盤價為基準
    
    // 2. 環境因子 (RSI & MA)
    const sma50 = allData.slice(baseIdx, baseIdx + 50).reduce((a, b) => a + b.c, 0) / 50;
    
    let gains=0, losses=0;
    for(let i=baseIdx; i<baseIdx+14; i++){
        let diff = allData[i].c - allData[i+1].c;
        if(diff>=0) gains+=diff; else losses-=diff;
    }
    const rsi = 100 - (100/(1+(gains/14)/(losses/14)||1));

    // 3. 權重計算
    let bias = 0;
    let details = [];
    
    // RSI 修正
    if(rsi > 70) { bias -= 0.15; details.push({txt:"RSI 過熱 (>70)", type:"neg"}); }
    else if(rsi < 30) { bias += 0.15; details.push({txt:"RSI 超賣 (<30)", type:"pos"}); }
    else details.push({txt:`RSI 中性 (${rsi.toFixed(1)})`, type:"neu"});
    
    // 趨勢修正
    if(refClose > sma50) { bias += 0.05; details.push({txt:"價格 > 50MA (多頭)", type:"pos"}); }
    else { bias -= 0.05; details.push({txt:"價格 < 50MA (空頭)", type:"neg"}); }

    // 4. 最終公式
    const inertia = 0.65; // V9 標準慣性係數
    let predH = refClose + (avgVol * inertia) + (avgVol * bias);
    let predL = refClose - (avgVol * inertia) + (avgVol * bias);
    
    // 風控壓縮
    const maxVolPast = Math.max(...history5.map(d=>d.h-d.l));
    let msg = null;
    if((predH-predL) > maxVolPast * 1.2) {
        const mid = (predH+predL)/2;
        const limit = (maxVolPast * 1.2)/2;
        predH = mid + limit; predL = mid - limit;
        msg = "波動率過大，執行壓縮保護";
    }

    return {
        predH, predL, refClose, avgVol, rsi, bias, details, msg,
        dir: ((predH+predL)/2 > refClose) ? 'UP' : 'DOWN',
        targetData: allData[tIdx], // 用於驗證
        dateStr: new Date(allData[tIdx].t).toLocaleDateString()
    };
}

// --- UI 渲染邏輯 ---
async function runAnalysis(isBT) {
    const sym = document.getElementById('symbol').value;
    const dateInput = document.getElementById('test-date').value;
    const loading = document.getElementById('loading');
    
    document.getElementById('panel-live').style.display = 'none';
    document.getElementById('panel-backtest').style.display = 'none';
    loading.style.display = 'block';

    try {
        const allData = await fetchStockData(sym);
        
        if(!isBT) {
            // Live 模式：
            // 若最新數據是今天(開盤中)，我們預測今天 (tIdx=0)，使用昨天(idx=1)開始的數據。
            // 若最新數據是昨天(未開盤)，我們預測今天 (虛擬的 tIdx=-1)，使用昨天(idx=0)開始的數據。
            
            // 簡單判斷：Yahoo 通常返回最新的一根 K 線 (即便是盤中)
            // 所以我們直接取 tIdx = 0 作為「當前關注的 K 線」
            const r = runPredictionModel(allData, 0);
            latestResult = r;
            renderLive(allData, r);
        } else {
            if(!dateInput) throw new Error("請選擇回測日期");
            const targetTs = new Date(dateInput).setHours(0,0,0,0);
            const tIdx = allData.findIndex(d => {
                const dTs = new Date(d.t).setHours(0,0,0,0);
                return Math.abs(dTs - targetTs) < 86400000;
            });
            if(tIdx === -1) throw new Error("該日期無交易數據");
            const r = runPredictionModel(allData, tIdx);
            latestResult = r;
            renderBacktest(allData, r, tIdx);
        }
    } catch(e) {
        alert("錯誤: " + e.message);
    } finally {
        loading.style.display = 'none';
    }
}

function renderLive(allData, r) {
    document.getElementById('panel-live').style.display = 'block';
    
    // 判斷日期顯示
    const d = new Date(r.targetData.t);
    const today = new Date();
    const isToday = d.getDate() === today.getDate() && d.getMonth() === today.getMonth();
    document.getElementById('res-date').innerText = isToday ? "TODAY (Real-time)" : r.dateStr;

    // 價格區間
    document.getElementById('pred-high').innerText = r.predH.toFixed(2);
    document.getElementById('pred-low').innerText = r.predL.toFixed(2);
    document.getElementById('pred-vol').innerText = `預期波幅: ${(r.predH-r.predL).toFixed(2)}`;
    
    // 方向徽章
    const badge = document.getElementById('direction-badge');
    badge.className = r.dir === 'UP' ? 'trend-badge trend-up' : 'trend-badge trend-down';
    badge.innerHTML = r.dir === 'UP' ? '<i class="fas fa-arrow-trend-up me-2"></i>看漲 (Bullish)' : '<i class="fas fa-arrow-trend-down me-2"></i>看跌 (Bearish)';

    // 歷史驗證表格
    const tbody = document.getElementById('history-body'); tbody.innerHTML = '';
    for(let i=0; i<5; i++) {
        const pastR = runPredictionModel(allData, i); // 計算過去每一天的預測
        const real = allData[i];
        const acc = calcAccuracy(pastR.predH, pastR.predL, real.h, real.l);
        const rowColor = acc > 70 ? 'text-success fw-bold' : '';
        tbody.innerHTML += `
            <tr>
                <td>${new Date(real.t).toLocaleDateString()}</td>
                <td>${real.l.toFixed(2)} - ${real.h.toFixed(2)}</td>
                <td>${pastR.predL.toFixed(2)} - ${pastR.predH.toFixed(2)}</td>
                <td class="${rowColor}">${acc.toFixed(0)}%</td>
            </tr>
        `;
    }

    // T+5 動能 (V9.3 Bar Style)
    const score = 50 + (r.dir==='UP'?20:-10) + (r.bias*100); 
    const p1 = Math.min(95, Math.max(5, score));
    const p2 = Math.min(95, Math.max(5, score * 0.8));
    const p3 = Math.min(95, Math.max(5, score * 0.6));
    
    document.getElementById('probs-container').innerHTML = `
        <div class="mb-3">
            <div class="d-flex justify-content-between small fw-bold mb-1"><span>Target +1% (短線動能)</span><span>${p1.toFixed(0)}%</span></div>
            <div class="prob-bar-bg"><div class="prob-bar-fill" style="width:${p1}%"></div></div>
        </div>
        <div class="mb-3">
            <div class="d-flex justify-content-between small fw-bold mb-1"><span>Target +3% (波段動能)</span><span>${p2.toFixed(0)}%</span></div>
            <div class="prob-bar-bg"><div class="prob-bar-fill" style="width:${p2}%; opacity:0.8"></div></div>
        </div>
        <div>
            <div class="d-flex justify-content-between small fw-bold mb-1"><span>Target +5% (爆發動能)</span><span>${p3.toFixed(0)}%</span></div>
            <div class="prob-bar-bg"><div class="prob-bar-fill" style="width:${p3}%; opacity:0.6"></div></div>
        </div>
    `;

    drawChart('chart-live', allData, r);
}

function renderBacktest(allData, r, tIdx) {
    document.getElementById('panel-backtest').style.display = 'block';
    document.getElementById('bt-date-display').innerText = r.dateStr;
    document.getElementById('bt-real').innerText = `${r.targetData.l.toFixed(2)} - ${r.targetData.h.toFixed(2)}`;
    document.getElementById('bt-pred').innerText = `${r.predL.toFixed(2)} - ${r.predH.toFixed(2)}`;
    
    const acc = calcAccuracy(r.predH, r.predL, r.targetData.h, r.targetData.l);
    document.getElementById('bt-score').innerText = acc.toFixed(1) + "%";
    document.getElementById('bt-score').className = acc>70 ? "fw-900 fs-3 text-success" : "fw-900 fs-3 text-warning";
    
    document.getElementById('bt-comment').innerText = acc > 80 
        ? "AI 評語：精準預測。當日走勢完全符合 V9 慣性模型，未受外力干擾。" 
        : "AI 評語：偏差發生。當日可能受突發新聞或財報影響，導致價格脫離慣性區間。";
        
    drawChart('chart-bt', allData.slice(tIdx), r, true);
}

// 深度邏輯解說 (V9.3 Content)
function showLogicPopup() {
    if(!latestResult) return;
    const r = latestResult;
    
    const biasHtml = r.details.map(d => 
        `<span class="badge ${d.type==='pos'?'bg-success':(d.type==='neg'?'bg-danger':'bg-secondary')} me-1">${d.txt}</span>`
    ).join(' ');

    const html = `
        <div class="step-container">
            <div class="step-num">1</div>
            <div class="step-title">慣性數據採樣 (Inertia Sampling)</div>
            <div class="step-desc">
                系統嚴格鎖定 <strong>${r.dateStr}</strong> 之前的 5 個交易日作為樣本，完全排除當日即時波動的干擾。
                <div class="viz-box">
                    基準收盤價 (Ref Close): <strong>$${r.refClose.toFixed(2)}</strong><br>
                    5日平均波幅 (Avg Vol): <strong>$${r.avgVol.toFixed(2)}</strong>
                </div>
            </div>
        </div>

        <div class="step-container">
            <div class="step-num">2</div>
            <div class="step-title">環境因子加權 (Contextual Bias)</div>
            <div class="step-desc">
                分析 RSI 動能與 MA 趨勢線，計算出對價格區間的偏移量。
                <div class="mt-2">${biasHtml}</div>
                <div class="text-muted small mt-1">總修正係數: ${(r.bias*100).toFixed(1)}%</div>
            </div>
        </div>

        <div class="step-container">
            <div class="step-num">3</div>
            <div class="step-title">區間生成公式 (Generation)</div>
            <div class="step-desc">
                <div class="formula-box">
                    High = Ref + (AvgVol × 0.65) + Bias<br>
                    Low  = Ref - (AvgVol × 0.65) + Bias
                </div>
                最終計算出 <strong>$${r.predL.toFixed(2)}</strong> 至 <strong>$${r.predH.toFixed(2)}</strong> 的震盪區間。
                ${r.msg ? `<div class="text-danger fw-bold mt-2"><i class="fas fa-exclamation-triangle"></i> ${r.msg}</div>` : ''}
            </div>
        </div>
    `;
    document.getElementById('modal-logic-content').innerHTML = html;
    new bootstrap.Modal(document.getElementById('logicModal')).show();
}

function drawChart(id, data, r, showReal=false) {
    const container = document.getElementById(id); container.innerHTML = '';
    const chart = LightweightCharts.createChart(container, {
        layout: { textColor: '#333', background: { type: 'solid', color: 'white' } },
        grid: { vertLines: { color: '#f0f0f0' }, horzLines: { color: '#f0f0f0' } },
        width: container.clientWidth, height: 350
    });
    
    const candleSeries = chart.addCandlestickSeries({ upColor: '#10b981', downColor: '#ef4444', borderVisible: false, wickUpColor: '#10b981', wickDownColor: '#ef4444' });
    
    // 繪圖數據處理
    const chartData = data.slice(0, 60).reverse().map(d => ({
        time: d.t/1000, open: d.o, high: d.h, low: d.l, close: d.c
    }));
    candleSeries.setData(chartData);
    
    // 繪製 AI 預測線 (虛線)
    // 為了在圖上顯示，我們將線畫在目標日期的位置
    const targetTime = r.targetData.t / 1000;
    
    // AI High
    const lineHigh = chart.addLineSeries({ color: '#4F46E5', lineWidth: 2, lineStyle: 2, title: 'AI High' });
    lineHigh.setData([{ time: targetTime - 86400*5, value: r.predH }, { time: targetTime, value: r.predH }]);
    
    // AI Low
    const lineLow = chart.addLineSeries({ color: '#4F46E5', lineWidth: 2, lineStyle: 2, title: 'AI Low' });
    lineLow.setData([{ time: targetTime - 86400*5, value: r.predL }, { time: targetTime, value: r.predL }]);

    chart.timeScale().fitContent();
}

function calcAccuracy(pH, pL, rH, rL) {
    const oH = Math.min(pH, rH); const oL = Math.max(pL, rL);
    if(oH <= oL) return 0;
    return ((oH - oL) / (Math.max(pH, rH) - Math.min(pL, rL))) * 100;
}

// 支援 Enter 鍵
document.getElementById('symbol').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') runAnalysis(false);
});
